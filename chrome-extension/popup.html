<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 320px; margin: 12px; color: #e8eaed; background: #1a1d24; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: block; font-size: 11px; color: #9aa0a6; margin-top: 8px; }
    input, textarea { width: 100%; box-sizing: border-box; background: #0f1115; border: 1px solid #333; color: #e8eaed; border-radius: 6px; padding: 6px 8px; font-size: 12px; }
    textarea { min-height: 80px; resize: vertical; }
    button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: #6c9eff; color: #0b0d10; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; border: 1px solid #444; color: #e8eaed; }
    .row { display: flex; gap: 6px; }
    .muted { font-size: 11px; color: #9aa0a6; margin-top: 6px; }
    .ok { color: #6bcb8a; font-size: 12px; }
    .err { color: #f07178; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Clip to Job Agent</h1>
  <label>Agent URL</label>
  <input id="baseUrl" placeholder="http://localhost:8000" />
  <label>Title</label>
  <input id="title" />
  <label>Company</label>
  <input id="company" />
  <label>URL</label>
  <input id="url" />
  <label>Description (excerpt)</label>
  <textarea id="description"></textarea>
  <button id="clip">Open import in Job Agent</button>
  <button id="saveSettings" class="secondary">Save agent URL</button>
  <p id="msg" class="muted"></p>
  <script src="popup.js"></script>
</body>
</html>
